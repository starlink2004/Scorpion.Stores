<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>العقرب / Scorpion</title>
  <style>
    :root {
      --bg: #050912;
      --surface: rgba(12, 19, 34, 0.9);
      --card: rgba(17, 27, 46, 0.92);
      --gold: #f6c445;
      --sky: #38bdf8;
      --red: #fb7185;
      --yellow: #fde047;
      --white: #f8fafc;
      --muted: #94a3b8;
      --wa: #22c55e;
      --wa-deep: #16a34a;
      --border: rgba(246, 196, 69, 0.3);
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      padding-bottom: 50px;
      overflow-x: hidden;
      position: relative;
    }

    .fx-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 8% 12%, rgba(56, 189, 248, 0.28), transparent 36%),
        radial-gradient(circle at 92% 16%, rgba(251, 113, 133, 0.26), transparent 38%),
        radial-gradient(circle at 85% 88%, rgba(246, 196, 69, 0.28), transparent 40%),
        radial-gradient(circle at 14% 90%, rgba(253, 224, 71, 0.22), transparent 36%);
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(42px);
      opacity: 0.6;
      animation: pulseOrb 7s ease-in-out infinite alternate;
    }
    .orb-blue { width: 240px; height: 240px; background: rgba(56, 189, 248, 0.48); top: -60px; left: -60px; }
    .orb-red { width: 230px; height: 230px; background: rgba(244, 63, 94, 0.45); top: 12%; right: -70px; animation-delay: 1.5s; }
    .orb-gold { width: 260px; height: 260px; background: rgba(245, 190, 65, 0.48); bottom: -80px; left: 18%; animation-delay: 3s; }
    .orb-yellow { width: 210px; height: 210px; background: rgba(250, 204, 21, 0.4); bottom: 8%; right: -60px; animation-delay: 2s; }

    .edge-circle {
      position: absolute;
      border-radius: 50%;
      border: 2px solid;
      opacity: 0.55;
    }
    .ec-1 { width: 76px; height: 76px; border-color: var(--sky); top: 16%; left: -26px; animation: driftLeft 9s ease-in-out infinite; }
    .ec-2 { width: 58px; height: 58px; border-color: var(--red); top: 54%; right: -18px; animation: driftRight 10s ease-in-out infinite; }
    .ec-3 { width: 90px; height: 90px; border-color: var(--gold); bottom: -30px; left: 12%; animation: driftUp 11s ease-in-out infinite; }
    .ec-4 { width: 50px; height: 50px; border-color: var(--yellow); top: 8%; right: 22%; animation: driftDown 8.5s ease-in-out infinite; }

    .edge-tri {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0.56;
      filter: drop-shadow(0 0 8px rgba(246, 196, 69, 0.4));
    }
    .et-1 { border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 32px solid var(--gold); top: 28%; right: -8px; transform: rotate(-28deg); animation: triRight 8.5s ease-in-out infinite; }
    .et-2 { border-left: 16px solid transparent; border-right: 16px solid transparent; border-bottom: 28px solid var(--red); bottom: 22%; left: -6px; transform: rotate(34deg); animation: triLeft 9.5s ease-in-out infinite; }
    .et-3 { border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 26px solid var(--sky); bottom: -8px; right: 24%; transform: rotate(-12deg); animation: triUp 10s ease-in-out infinite; }
    .et-4 { border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 24px solid var(--yellow); top: -6px; left: 34%; transform: rotate(155deg); animation: triDown 9s ease-in-out infinite; }

    @keyframes pulseOrb { 0% { transform: scale(0.95); opacity: 0.45; } 100% { transform: scale(1.12); opacity: 0.68; } }
    @keyframes driftLeft { 0%, 100% { transform: translateX(0) scale(1); } 50% { transform: translateX(26px) scale(1.08); } }
    @keyframes driftRight { 0%, 100% { transform: translateX(0) scale(1); } 50% { transform: translateX(-24px) scale(1.08); } }
    @keyframes driftUp { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-26px) scale(1.06); } }
    @keyframes driftDown { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(20px) scale(1.06); } }
    @keyframes triRight { 0%, 100% { transform: translate(0, 0) rotate(-28deg); } 50% { transform: translate(-22px, -14px) rotate(-10deg); } }
    @keyframes triLeft { 0%, 100% { transform: translate(0, 0) rotate(34deg); } 50% { transform: translate(22px, -16px) rotate(52deg); } }
    @keyframes triUp { 0%, 100% { transform: translate(0, 0) rotate(-12deg); } 50% { transform: translate(12px, -24px) rotate(10deg); } }
    @keyframes triDown { 0%, 100% { transform: translate(0, 0) rotate(155deg); } 50% { transform: translate(-12px, 22px) rotate(135deg); } }

    header, main {
      position: relative;
      z-index: 2;
    }

    header {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 30;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo-ring {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, var(--sky), var(--gold), var(--red), var(--yellow));
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.4), 0 0 18px rgba(246, 196, 69, 0.35);
      flex-shrink: 0;
    }

    .logo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #070d19;
      color: var(--gold);
      display: grid;
      place-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--gold), var(--yellow), var(--sky));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tiktok-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.96));
      color: #ffffff;
      border: 1px solid rgba(56, 189, 248, 0.7);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.25);
    }

    .grid {
      max-width: 1140px;
      margin: 20px auto;
      padding: 0 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    }

    .media-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #040811;
      overflow: hidden;
    }
    .media-box img,
    .media-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .pid-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(5, 9, 18, 0.86);
      color: var(--sky);
      border: 1px solid rgba(56, 189, 248, 0.45);
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .p-name { margin: 0; font-size: 1.06rem; font-weight: 800; }
    .p-price { font-size: 1.22rem; font-weight: 900; color: var(--gold); }

    .wa-btn {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: linear-gradient(135deg, var(--wa), var(--wa-deep));
      color: #ffffff;
      font-weight: 800;
      font-size: 0.92rem;
      padding: 11px 14px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(34, 197, 94, 0.3);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="fx-layer" aria-hidden="true">
    <div class="glow-orb orb-blue"></div>
    <div class="glow-orb orb-red"></div>
    <div class="glow-orb orb-gold"></div>
    <div class="glow-orb orb-yellow"></div>

    <div class="edge-circle ec-1"></div>
    <div class="edge-circle ec-2"></div>
    <div class="edge-circle ec-3"></div>
    <div class="edge-circle ec-4"></div>

    <div class="edge-tri et-1"></div>
    <div class="edge-tri et-2"></div>
    <div class="edge-tri et-3"></div>
    <div class="edge-tri et-4"></div>
  </div>

  <header>
    <div class="brand">
      <div class="logo-ring">
        <div class="logo-inner">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.5"/>
            <path d="M12 8.5V4.5l-2-1.8"/>
            <path d="M12 8.5V4.5l2-1.8"/>
            <path d="M8.5 11H5l-2-1.8"/>
            <path d="M8.5 13H5l-2 1.8"/>
            <path d="M15.5 11H19l2-1.8"/>
            <path d="M15.5 13H19l2 1.8"/>
            <path d="M12 15.5c0 3.8 3.5 5 5.5 3"/>
            <path d="M17.5 18.5l2-0.8"/>
          </svg>
        </div>
      </div>
      <h1>العقرب / Scorpion</h1>
    </div>

    <a
      class="tiktok-btn"
      href="https://www.tiktok.com/@scorpion.6.3?_r=1&_d=f4k83f1hk3bfeb&sec_uid=MS4wLjABAAAAQNdZm8O0it3gwGrityFZe6Szcjp3GpWaO4cWX58_YBlB724iHkNHvw2bcwxDPDaL&share_author_id=7506297014163145744&sharer_language=ar&source=h5_t&u_code=efbfcg2gg5gil8&timestamp=1795118122&user_id=7396353614686618657&sec_user_id=MS4wLjABAAAA64A3eOZzjO31chxX_IAaMusPrkftPai1VJaRusZKE5vdDU1geUwHQwW68-lN5YcU&item_author_type=2&utm_source=copy&utm_campaign=client_share&utm_medium=android&share_iid=7708810453245708054&share_link_id=d6d28935-6428-4f47-a5e4-9f64e2599c8f&share_app_id=1180&ugbiz_name=ACCOUNT&ug_btm=b6880%2Cb2878&social_share_type=5&share_enter_from=others_homepage&item_author_type=2&enable_checksum=1"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
      </svg>
      <span>تيك توك @scorpion.6.3</span>
    </a>
  </header>

  <main class="grid" id="storeGrid"></main>

  <script>
    const BOT_TOKEN = "9254858556:AAGPpRJt-u-ZpaeEAsjxQaGt0BbzxRTzmmY";
    const ADMIN_ID = 8940296890;
    const WHATSAPP_NUMBER = "963947895393";

    const API = `https://api.telegram.org/bot${BOT_TOKEN}`;
    const FILE_API = `https://api.telegram.org/file/bot${BOT_TOKEN}`;

    let products = JSON.parse(localStorage.getItem("alaqrab_tg_only_items") || "{}");
    let lastProdId = null;

    function saveProducts() {
      localStorage.setItem("alaqrab_tg_only_items", JSON.stringify(products));
    }

    async function getFileUrl(fileId) {
      try {
        const res = await fetch(`${API}/getFile?file_id=${encodeURIComponent(fileId)}`);
        const data = await res.json();
        if (!data.ok || !data.result?.file_path) return null;
        return `${FILE_API}/${data.result.file_path}`;
      } catch {
        return null;
      }
    }

    function parseCaption(caption = "") {
      const parts = caption.trim().split("|").map(s => s.trim());
      return {
        name: parts[0] || "منتج متجر العقرب",
        price: parts[1] || "تواصل للسعر"
      };
    }

    async function syncBot() {
      try {
        const res = await fetch(`${API}/getUpdates?allowed_updates=${encodeURIComponent(JSON.stringify(["message", "edited_message"]))}`);
        const data = await res.json();
        if (!data.ok) return;

        for (const upd of data.result) {
          const msg = upd.message || upd.edited_message;
          if (!msg) continue;
          if (msg.from && Number(msg.from.id) !== ADMIN_ID) continue;

          const id = String(msg.message_id);
          const caption = (msg.caption || "").trim();
          const text = (msg.text || "").trim();

          if (text === "حذف الكل" || text === "مسح الكل") {
            products = {};
            lastProdId = null;
            continue;
          }

          if (text.startsWith("حذف ")) {
            const targetId = text.replace("حذف ", "").trim().replace(/^#/, "");
            delete products[targetId];
            if (lastProdId === targetId) lastProdId = null;
            continue;
          }

          if (text.startsWith("سعر ")) {
            const parts = text.replace("سعر ", "").trim().split("|").map(s => s.trim());
            const targetId = (parts[0] || "").replace(/^#/, "");
            const newPrice = parts[1] || "";
            if (targetId && newPrice && products[targetId]) {
              products[targetId].price = newPrice;
            }
            continue;
          }

          let mediaType = null;
          let fileId = null;
          if (msg.photo && msg.photo.length > 0) {
            mediaType = "photo";
            fileId = msg.photo[msg.photo.length - 1].file_id;
          } else if (msg.video) {
            mediaType = "video";
            fileId = msg.video.file_id;
          }

          if (mediaType && caption.startsWith("تعديل ")) {
            const targetId = caption.replace("تعديل ", "").trim().replace(/^#/, "");
            if (products[targetId]) {
              const url = await getFileUrl(fileId);
              if (url) {
                products[targetId].type = mediaType;
                products[targetId].url = url;
              }
            }
            continue;
          }

          if (mediaType) {
            const url = await getFileUrl(fileId);
            if (url) {
              const parsed = parseCaption(caption);
              products[id] = { id, type: mediaType, url, name: parsed.name, price: parsed.price };
              lastProdId = id;
            }
            continue;
          }

          if (!upd.edited_message && text && lastProdId && products[lastProdId]) {
            const target = products[lastProdId];
            if (text.includes("|")) {
              const parsed = parseCaption(text);
              target.name = parsed.name;
              target.price = parsed.price;
            } else if (/[\d$€£ل\.س]|دولار|ليرة/.test(text) || target.price !== "تواصل للسعر") {
              target.price = text;
            } else {
              target.name = text;
            }
            continue;
          }

          if (upd.edited_message && products[id] && caption) {
            const parsed = parseCaption(caption);
            products[id].name = parsed.name;
            products[id].price = parsed.price;
          }
        }

        saveProducts();
        render();
      } catch {}
    }

    function render() {
      const grid = document.getElementById("storeGrid");
      const list = Object.values(products).reverse();

      if (list.length === 0) {
        grid.innerHTML = `<div class="empty">بانتظار المنتجات من بوت تيليجرام...</div>`;
        return;
      }

      grid.innerHTML = list.map(item => {
        const media = item.type === "video"
          ? `<video src="${item.url}" controls playsinline preload="metadata"></video>`
          : `<img src="${item.url}" alt="${item.name}" loading="lazy" />`;

        const waText = encodeURIComponent(
          `مرحباً متجر العقرب، أريد طلب المنتج:\n• الاسم: ${item.name}\n• السعر: ${item.price}\n• الرقم: #${item.id}`
        );
        const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${waText}`;

        return `
          <article class="card">
            <div class="media-box">
              <span class="pid-tag">#${item.id}</span>
              ${media}
            </div>
            <div class="card-body">
              <h2 class="p-name">${item.name}</h2>
              <div class="p-price">${item.price}</div>
              <a class="wa-btn" href="${waUrl}" target="_blank" rel="noopener noreferrer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M20.52 3.48A11.82 11.82 0 0 0 12.04 0C5.46 0 .1 5.36.1 11.94c0 2.1.55 4.16 1.6 5.97L0 24l6.26-1.64a11.9 11.9 0 0 0 5.78 1.48h.01c6.58 0 11.94-5.36 11.94-11.94 0-3.19-1.24-6.19-3.48-8.42zM12.05 21.8h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.72.97.99-3.63-.24-.37a9.85 9.85 0 0 1-1.51-5.22c0-5.45 4.44-9.89 9.9-9.89 2.64 0 5.12 1.03 6.99 2.9a9.82 9.82 0 0 1 2.9 7c0 5.45-4.44 9.89-9.89 9.89zm5.43-7.41c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.05 1.03-1.05 2.5 0 1.48 1.08 2.91 1.23 3.11.15.2 2.12 3.24 5.14 4.54.72.31 1.28.5 1.72.64.72.23 1.38.2 1.9.12.58-.09 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35z"/>
                </svg>
                <span>طلب عبر واتساب</span>
              </a>
            </div>
          </article>
        `;
      }).join("");
    }

    render();
    syncBot();
    setInterval(syncBot, 5000);
  </script>

</body>
</html>
